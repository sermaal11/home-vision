<main class="min-h-screen bg-zinc-950 text-white">

	<header class="border-b border-zinc-800 bg-zinc-950/95">

		<div class="mx-auto flex max-w-6xl flex-col gap-3 px-6 py-5 sm:flex-row sm:items-center sm:justify-between lg:px-8">

			<div class="space-y-1">

				<h1 class="text-2xl font-semibold">
					Home Vision
				</h1>

				<p class="text-sm text-zinc-400">
					{{ message() }}
				</p>
			</div>

			<nav class="flex items-center gap-2 text-sm">

				<a
					routerLink="/"
					routerLinkActive="bg-zinc-800 text-white"
					[routerLinkActiveOptions]="{ exact: true }"
					class="rounded-md px-3 py-2 text-zinc-400 transition hover:bg-zinc-900 hover:text-white">
					Home
				</a>

				<a
					routerLink="/motion-lab"
					routerLinkActive="bg-zinc-800 text-white"
					class="rounded-md px-3 py-2 text-zinc-400 transition hover:bg-zinc-900 hover:text-white">
					Motion Lab
				</a>

				<a
					routerLink="/face-detection"
					routerLinkActive="bg-zinc-800 text-white"
					class="rounded-md px-3 py-2 text-zinc-400 transition hover:bg-zinc-900 hover:text-white">
					Face Detection
				</a>

			</nav>

		</div>

	</header>

	<div class="mx-auto flex max-w-6xl flex-col gap-8 p-6 lg:p-8">

		<router-outlet />

	</div>

</main>
