<div class="grid gap-4 md:grid-cols-2">

	<div class="space-y-2">

		<h2 class="text-sm font-medium text-zinc-300">
			1. Original
		</h2>

		<video
			#videoElement
			autoplay
			playsinline
			muted
			class="aspect-video w-full rounded-lg border border-zinc-700 object-cover">
		</video>

	</div>

	<div class="space-y-2">

		<h2 class="text-sm font-medium text-zinc-300">
			2. Greyscale
		</h2>

		<img
			*ngIf="grayscaleFrameUrl()"
			[src]="grayscaleFrameUrl()"
			alt="Grayscale frame"
			class="aspect-video w-full rounded-lg border border-zinc-700 object-cover"
		/>

	</div>

	<div class="space-y-2">

		<h2 class="text-sm font-medium text-zinc-300">
			3. Blur
		</h2>

		<img
			*ngIf="blurFrameUrl()"
			[src]="blurFrameUrl()"
			alt="Blurred frame"
			class="aspect-video w-full rounded-lg border border-zinc-700 object-cover"
		/>

	</div>

	<div class="space-y-2">

		<h2 class="text-sm font-medium text-zinc-300">
			4. Difference
		</h2>

		<img
			*ngIf="differenceFrameUrl()"
			[src]="differenceFrameUrl()"
			alt="Difference frame"
			class="aspect-video w-full rounded-lg border border-zinc-700 object-cover"
		/>

	</div>

	<div class="space-y-2">

		<h2 class="text-sm font-medium text-zinc-300">
			5. Thresholding
		</h2>

		<img
			*ngIf="thresholdFrameUrl()"
			[src]="thresholdFrameUrl()"
			alt="Threshold frame"
			class="aspect-video w-full rounded-lg border border-zinc-700 object-cover"
		/>
	</div>

	<canvas #canvasElement class="hidden">
	</canvas>

</div>
